<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D0E0B"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body><title>Kitchen Chic Chicken</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>  <rect width='512' height='512' rx='112' fill='%230D0E0B'/>  <g>    <rect x='216' y='62' width='80' height='38' rx='12' fill='%23D6F24A'/>    <rect x='242' y='96' width='28' height='40' fill='%23F1F4E8'/>    <rect x='368' y='118' width='30' height='52' rx='9' fill='%23F1F4E8' transform='rotate(45 383 144)'/>    <circle cx='256' cy='292' r='150' fill='none' stroke='%23F1F4E8' stroke-width='32'/>    <path d='M256 292 L256 170 A122 122 0 0 1 361.7 353 Z' fill='%23D6F24A'/>    <circle cx='256' cy='292' r='22' fill='%23F1F4E8'/>    <circle cx='256' cy='292' r='9' fill='%230D0E0B'/>  </g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout : cuisine = grille plein écran de gros carrés-minuteurs lisibles à 3 m ; dashboard = colonne 1100px, filtres, chiffres clés, puis détail */
:root{
  --bg:#0D0E0B; --surface:#171913; --surface-2:#20231B; --line:#2D3126;
  --fg:#F1F4E8; --muted:#979E8B; --accent:#D6F24A; --accent-ink:#141703;
  --danger:#FF453A; --danger-deep:#4A0A06; --danger-text:#FF8A82; --ok:#62D98F;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{min-height:44px;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input[type=color]{padding:2px;height:44px;width:56px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px;padding-block:14px;flex-wrap:wrap}
.top .sp{flex:1}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.logo .lg{display:inline-flex;width:30px;height:30px;color:var(--fg)}
.logo .lg svg,.start-ic svg{width:100%;height:100%}
.start-ic{width:96px;height:96px;color:var(--fg);background:var(--surface);border-radius:24px;padding:12px}
.logo b{background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:6px}
.chip{min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;text-decoration:none;color:var(--fg);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.clock{font-family:var(--f-display);font-weight:700;font-size:26px}
.banner{background:var(--surface-2);border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}

/* ---------- Cuisine ---------- */
.k{display:flex;flex-direction:column;min-height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding-bottom:16px;align-content:start}
.tile{--c:#D6F24A;container-type:inline-size;position:relative;text-align:left;border:0;border-radius:22px;background:var(--surface);padding:22px 20px 20px;min-height:240px;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent);touch-action:manipulation}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:9px;background:var(--c)}
.t-name{font-family:var(--f-display);font-weight:800;font-size:50px;line-height:1.05;text-transform:uppercase;letter-spacing:0;white-space:nowrap;overflow:hidden}
.t-cd{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,27cqi,116px);line-height:.95;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);margin-top:6px}
.t-sub{font-weight:700;font-size:19px;color:var(--muted)}
.t-bar{margin-top:auto;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--c);border-radius:inherit}
.tile.run{background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.tile.run .t-cd,.tile.run .t-sub{color:var(--fg)}
.tile.warn .t-cd{color:var(--c)}
.tile.exp{background:var(--danger);box-shadow:none;animation:flash 1s steps(1) infinite}
.tile.exp::before{background:#fff}
.tile.exp .t-cd,.tile.exp .t-sub,.tile.exp .t-name{color:#fff}
.tile.exp .t-bar{visibility:hidden}
.tile.exp .t-cd{font-size:clamp(48px,22cqi,100px)}
@keyframes flash{50%{background:var(--danger-deep)}}
@media (prefers-reduced-motion:reduce){.tile.exp{animation:none}}
.start{display:flex;flex-direction:column;gap:16px;max-width:520px;margin:6vh auto 40px;width:100%}
.start h1{font-family:var(--f-display);font-size:clamp(48px,9vw,80px);line-height:.92;margin:0;text-transform:uppercase}
.start h1 span{color:var(--accent)}
.start p{margin:0;color:var(--muted)}

/* ---------- Fenêtres ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;width:100%;max-width:580px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{font-family:var(--f-display);font-size:32px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.sheet .sub{color:var(--muted);margin:0 0 4px;font-weight:600;font-size:17px}
.qty{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.big{min-height:96px;border-radius:18px;border:0;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:manipulation}
.big{padding:8px 6px;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums;white-space:nowrap}.big.mid{font-size:32px}.big.long{font-size:22px}
.big small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);margin-top:6px}
.k .top .chip{min-height:52px;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;font-size:16px}
.closing-btn{background:var(--surface-2)}
.crows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:8px}
.sheet.wide{max-width:1100px}
.cgrp{grid-column:1/-1;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;margin:12px 0 0;color:var(--muted)}
.crow.has{box-shadow:inset 0 0 0 2px var(--accent)}
.sticky-act{position:sticky;bottom:-22px;margin:0 -22px -22px;padding:12px 22px 22px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:2fr 1fr;gap:10px}
.sticky-act .act{margin:0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto 64px;gap:10px;align-items:center;background:var(--surface-2);border-radius:16px;padding:10px 12px}
@media (max-width:560px){.crow{grid-template-columns:64px 1fr 64px}.crow .cn{grid-column:1/-1}}
.cn{min-width:0;overflow-wrap:anywhere;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;line-height:1}
.cn small{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);text-transform:none;margin-top:4px}
.cb{width:64px;height:64px;border-radius:50%;border:0;background:var(--surface);font-size:34px;font-weight:700;touch-action:manipulation}
.cq{font-family:var(--f-display);font-weight:800;font-size:40px;text-align:center;font-variant-numeric:tabular-nums;min-width:4.2ch;white-space:nowrap}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dev{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--muted)}
.dev.ok{border-left-color:var(--ok)}.dev.idle{border-left-color:#F5B83D}.dev.off{border-left-color:var(--danger)}
.dev-top{display:flex;align-items:center;gap:8px}.dev-top strong{font-size:16px}
.dev .st{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dev.ok .st{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}.dev.idle .st{background:#F5B83D}.dev.off .st{background:var(--danger)}
.dev-st{font-weight:700}.dev.off .dev-st{color:var(--danger-text)}.dev.ok .dev-st{color:var(--ok)}
.dev-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.dev-meta .bad{color:var(--danger-text);font-weight:700}
.alert{background:color-mix(in srgb,var(--danger) 18%,var(--surface));border:1px solid var(--danger);color:var(--fg);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:10px}
.sift-btn b{font-weight:700;margin-left:4px;opacity:.8}
.sift-btn.due{background:#F5B83D;color:#1a1300;border-color:#F5B83D;animation:siftp 1s steps(1) infinite}
@keyframes siftp{50%{background:#7a5600;color:#fff}}
.sift-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;background:#F5B83D;color:#1a1300;padding:18px 22px;margin-bottom:14px;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.2vw,34px);text-transform:uppercase;text-align:left;animation:siftp 1s steps(1) infinite}
.sift-bar .sb-cta{font-size:.7em;background:#1a1300;color:#F5B83D;border-radius:999px;padding:8px 16px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sift-bar,.sift-btn.due{animation:none}}
.big.rec{box-shadow:inset 0 0 0 3px var(--accent);position:relative}
.big .tag{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 8px;margin-bottom:6px;letter-spacing:.02em}
.rwrap.need{animation:need .5s}
@keyframes need{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.rwrap.need .sub{color:var(--danger-text)}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.hbar .tr{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--danger);border-radius:inherit}
.hbar b{font-variant-numeric:tabular-nums;font-weight:600}
.panel{background:var(--surface);border-radius:14px;padding:16px}
.kpi.ok .v{color:var(--ok)}
.big:active{background:var(--accent);color:var(--accent-ink)}
.act{min-height:66px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:19px;padding:0 20px;text-align:left;touch-action:manipulation}
.act.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act.dang{background:transparent;border-color:var(--danger);color:var(--danger-text)}
.act.ghost{background:transparent;color:var(--muted)}
.step{display:flex;align-items:center;gap:14px;justify-content:center}
.step button{width:84px;height:84px;border-radius:50%;border:0;background:var(--surface-2);font-size:44px;font-weight:700;line-height:1;touch-action:manipulation}
.step output{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.quick .chip{font-size:16px;padding:10px 18px}

/* ---------- Dashboard ---------- */
.ad{max-width:1100px;margin:0 auto;padding-bottom:48px}
.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:26px}
.kpi{background:var(--surface);border-radius:16px;padding:16px;container-type:inline-size;min-width:0}
.kpi .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:min(46px,21cqi);white-space:nowrap;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.money .v{font-size:min(32px,15cqi);white-space:normal;line-height:1.25}
.filters.custom label.f{width:auto}
.kpi.sold .v{color:var(--accent)}
.kpi.loss .v{color:var(--danger-text)}
.blk{margin-bottom:28px}
.blk h3{font-family:var(--f-display);text-transform:uppercase;font-size:22px;letter-spacing:.03em;margin:0 0 10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
tr:last-child td{border-bottom:0}
tr.tot td{border-top:2px solid var(--line);font-weight:800}tr.grp td{background:var(--surface-2);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
td.loss{color:var(--danger-text);font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.p-cook{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.p-discard{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger-text)}
.p-sift{background:color-mix(in srgb,#F5B83D 22%,transparent);color:#F5B83D}
.p-closing{background:color-mix(in srgb,#8FB8FF 22%,transparent);color:#8FB8FF}
.p-close{background:var(--surface-2);color:var(--muted)}
.p-cancel{background:var(--surface-2);color:var(--muted)}
.chart{display:flex;align-items:stretch;gap:4px;height:220px;padding:14px 12px 0;background:var(--surface);border-radius:14px;overflow-x:auto;background-image:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 25%);background-origin:content-box;background-size:100% calc(100% - 26px);background-repeat:no-repeat}
.col{flex:1 0 30px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bars{flex:1;width:100%;display:flex;align-items:flex-end;gap:2px;justify-content:center}
.bars i{width:42%;max-width:18px;border-radius:4px 4px 0 0}
.bars .a{background:var(--accent)} .bars .b{background:var(--danger)}
.col span{font-size:11px;color:var(--muted);padding-bottom:8px;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.prods{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.prow{background:var(--surface);border-radius:16px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;border-left:6px solid var(--c,#888)}
.prow .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;min-width:0}
label.f .hint{text-transform:none;letter-spacing:0;font-weight:400}
label.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.snd{display:block;width:100%;margin:0 0 12px;padding:16px;border:0;border-radius:16px;background:#F5B83D;color:#111;font-weight:800;font-size:22px}
.t-undo{margin-left:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:10px 16px;font-size:16px;min-height:44px}
.toast.act-t{display:flex;align-items:center;gap:6px;font-size:17px;padding:10px 12px 10px 18px}
.big-act{font-size:22px;min-height:76px}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.num-b{min-height:72px;border:0;border-radius:16px;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--fg);white-space:nowrap;touch-action:manipulation}
.num-b small{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;margin-top:2px}
.num-b:active{background:var(--danger);color:#fff}
.reasons.small .chip{font-size:14px}
.dropgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.drop-p{min-height:96px;border:0;border-radius:18px;background:var(--surface-2);border-top:8px solid var(--c);font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--fg);padding:10px;touch-action:manipulation}
.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tr-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.tr-fixed{min-height:44px;display:flex;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:800}
.tr-rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tr-r{min-height:72px;border:2px solid var(--line);border-radius:18px;background:var(--surface-2);color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;touch-action:manipulation}
.tr-r.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tr-sum{grid-column:1/-1}.tr-err{grid-column:1/-1;background:var(--danger);color:#fff;font-weight:800;font-size:19px;padding:12px 16px;border-radius:14px;line-height:1.25}.tr-need{outline:3px solid var(--danger);outline-offset:4px;border-radius:16px}@keyframes trshake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:trshake .3s 2}.tr-total{font-weight:800;color:var(--fg)}
.sticky-act .tr-sum:empty{display:none}
.tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-other{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.tr-q{display:flex;align-items:center;gap:10px}.tr-q input{font-size:22px;font-weight:700}.tr-unit{font-weight:700;white-space:nowrap}
.tr-val{font-weight:700;margin-top:-4px}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
@media (max-width:560px){.tr-grid,.tr-other{grid-template-columns:1fr 1fr}}
.hero{background:var(--surface);border-radius:20px;padding:20px 22px;margin:6px 0 22px;border:1px solid var(--line)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero h2{margin:0;font-family:var(--f-display);text-transform:uppercase;font-size:26px}
.hero-txt{font-size:18px;line-height:1.55;margin:10px 0 16px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;white-space:nowrap}
.badge.sm{padding:3px 10px;font-size:13px}

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const x=[...b].map(v=>v.toString(16).padStart(2,"0")).join("");
  return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}`;
}
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===false || v==null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="style") for (const [sk,sv] of Object.entries(v)) el.style.setProperty(sk, sv);
    else if (k==="class") el.className = v;
    else if (k==="value") el.value = v;
    else if (k==="checked") el.checked = !!v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  kids.flat(Infinity).forEach(c => { if (c==null || c===false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}

function ev(type, restoId, p, label, pieces, date, extra){
  return { id:uid(), restaurant_id:restoId, product_id:p.id, product_name:p.name, type, label:String(label), pieces,
    reason:(extra&&extra.reason)||null, late_seconds:(extra&&extra.late!=null)?extra.late:null, created_at:(date||new Date()).toISOString() };
}
const p2 = n => String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
function aggLocal(events, grain){
  const m=new Map();
  for (const e of events){
    const d=new Date(e.created_at);
    const bucket = grain==="hour" ? String(d.getHours()) : grain==="month" ? dayKey(d).slice(0,7) : dayKey(d);
    const k=[bucket,e.restaurant_id,e.product_id,e.type,e.reason||"",e.label||""].join("|");
    const r=m.get(k)||{bucket,restaurant_id:e.restaurant_id,product_id:e.product_id,product_name:e.product_name,type:e.type,reason:e.reason||null,label:e.label||null,n:0,pieces:0,late_n:0,late_sum:0,late_ontime:0,late5:0};
    r.n++; r.pieces+=e.pieces;
    if (e.late_seconds!=null){ r.late_n++; r.late_sum+=e.late_seconds; if(e.late_seconds<=120) r.late_ontime++; if(e.late_seconds>300) r.late5++; }
    m.set(k,r);
  }
  return [...m.values()];
}

/* ---------- Données d'exemple (mode démo) ---------- */
function seedDemo(){
  const out=[], now=new Date(), rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  for (let d=13; d>=0; d--){
    const day=new Date(now); day.setDate(now.getDate()-d);
    DEFAULT_RESTAURANTS.forEach((r,ri)=>{
      const traffic=[1,0.8,1.2,0.65][ri]*([5,6].includes(day.getDay())?1.3:1);
      const tc=new Date(day); tc.setHours(22,rnd(5,40),0,0);
      [[10,0],[15,30],[19,30]].forEach(([hh,mm])=>{ const ts=new Date(day); ts.setHours(hh,mm+ri*3,0,0); if (ts<=now) out.push(ev("sift",r.id,{id:"panure",name:"Panure"},"ok",rnd(170,215),ts)); });
      if (tc<=now) DEFAULT_SIDES.forEach(sd=>{ const q=sd.unit==="g"?rnd(0,8)*50:rnd(0,6); if(q) out.push(ev("closing",r.id,sd,sd.unit,q,tc)); });
      DEFAULT_PRODUCTS.forEach(p=>{
        const n=Math.round(rnd(8,15)*traffic);
        for (let i=0;i<n;i++){
          const lunch=Math.random()<0.45, hr=lunch?rnd(11,13):rnd(17,21);
          const ts=new Date(day); ts.setHours(hr,rnd(0,59),rnd(0,59),0);
          if (ts>now) continue;
          const q=p.quantities[Math.floor(Math.random()*p.quantities.length)];
          out.push(ev("cook",r.id,p,q.label,q.pieces,ts));
          const late=(hr===13||hr===21);
          const lateS = Math.random()<0.12 ? rnd(300,720) : Math.random()<0.3 ? rnd(121,299) : rnd(5,120);
          const t2=new Date(ts.getTime()+p.minutes*60000+lateS*1000);
          if (t2>now) continue;
          if (Math.random()<(late?0.55:0.22)){
            const dp=Math.max(1,Math.round(q.pieces*Math.random()*(late?0.35:0.15)));
            const rr=Math.random(), reason = rr<0.7?"time":rr<0.85?"overcooked":rr<0.95?"dropped":"other";
            out.push(ev("discard",r.id,p,q.label,dp,t2,{reason,late:lateS}));
          } else if (Math.random()<0.5){
            out.push(ev("close",r.id,p,q.label,0,t2,{late:lateS}));
          }
        }
      });
    });
  }
  return out;
}

let outbox = LS.get("dc_outbox", []), flushing=false;
function logEvent(e){ outbox.push(e); LS.set("dc_outbox",outbox); flush(); }
const withTimeout = (pr,ms=15000) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
const isDbReject = e => !!(e && e.code && !/timeout|fetch|network/i.test(String(e.message||"")));
async function flush(){
  if (flushing || !outbox.length) { updateSync(); return; }
  flushing=true; const batch=outbox.slice(0,200), sent=[];
  try{ await withTimeout(store.insertEvents(batch)); batch.forEach(b=>sent.push(b.id)); }
  catch(e){
    if (isDbReject(e)){ // une ligne refusée par la base ne doit pas bloquer les autres
      const bad=[];
      for (const one of batch){
        try{ await withTimeout(store.insertEvents([one])); sent.push(one.id); }
        catch(e2){ if (isDbReject(e2)){ bad.push(one); sent.push(one.id); } else break; }
      }
      if (bad.length) LS.set("dc_rejected", LS.get("dc_rejected",[]).concat(bad).slice(-500));
    }
  }
  if (sent.length){ const ids=new Set(sent); outbox=outbox.filter(x=>!ids.has(x.id)); LS.set("dc_outbox",outbox); }
  flushing=false; updateSync();
  if (sent.length && outbox.length) flush();
}

async function refreshSift(){
  if (!K.restoId) return;
  try{
    const last=await store.lastSift(K.restoId);
    const since=last || new Date(Date.now()-14*86400000).toISOString();
    let c=await store.cookedSince(K.restoId,since);
    // ajouter les actions pas encore envoyées
    const pend=outbox.filter(e=>e.restaurant_id===K.restoId);
    let iSift=-1; pend.forEach((e,i)=>{ if(e.type==="sift") iSift=i; });
    if (iSift>=0) c=0;
    pend.slice(iSift+1).forEach(e=>{ if(e.type==="cook") c+=e.pieces; else if(e.type==="cancel") c-=e.pieces; });
    K.sift={count:Math.max(0,c),since,ready:true};
  }catch(e){}
  drawSift();
}

/* Conseil : demande moyenne vendue pendant la durée de maintien, même jour de semaine, 4 dernières semaines */
function advise(p){
  const hist=K.hist||[]; if (!hist.length || !p.quantities.length) return null;
  const now=new Date(), dow=now.getDay(), m0=now.getHours()*60+now.getMinutes(), m1=m0+p.minutes;
  const days=new Set(); let net=0;
  for (const e of hist){
    if (e.product_id!==p.id) continue;
    const d=new Date(e.created_at); if (d.getDay()!==dow) continue;
    if (d.toDateString()===now.toDateString()) continue;
    days.add(d.toDateString());
    const m=d.getHours()*60+d.getMinutes();
    if ((e.type==="cook"||e.type==="cancel") && m>=m0 && m<m1) net += (e.type==="cook"?1:-1)*e.pieces;
    if (e.type==="discard" && m>=m0+p.minutes && m<m1+p.minutes+10) net -= e.pieces;
  }
  if (days.size<2) return null;
  const demand=net/days.size; if (demand<=0.5) return null;
  const sorted=[...p.quantities].sort((a,b)=>a.pieces-b.pieces);
  return (sorted.find(q=>q.pieces>=demand*0.9)||sorted[sorted.length-1]).label;
}

function initAudio(){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); }catch(e){} }
function beep(){
  if (!audio) return;
  try{ if (audio.state!=="running") audio.resume(); }catch(e){}
  const vol=Math.max(0.05,Number(CFG.settings.volume??0.8)), t0=audio.currentTime;
  [0,0.22,0.44].forEach(off=>{
    const o=audio.createOscillator(), g=audio.createGain();
    o.type="square"; o.frequency.value=1046;
    g.gain.setValueAtTime(0.0001,t0+off); g.gain.exponentialRampToValueAtTime(vol*0.5,t0+off+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+off+0.16);
    o.connect(g).connect(audio.destination); o.start(t0+off); o.stop(t0+off+0.18);
  });
  try{ navigator.vibrate && navigator.vibrate(300); }catch(e){}
}

function pinPad(inp, go){
  inp.setAttribute("inputmode","none"); inp.classList.add("pinbox"); inp.setAttribute("autocomplete","off");
  const add=d=>{ if(inp.value.length<8) inp.value+=d; };
  const k=(lab,fn,cls)=>h("button",{type:"button",class:cls||"",onclick:e=>{e.preventDefault(); fn();}},lab);
  const pad=h("div",{class:"pinpad"},...["1","2","3","4","5","6","7","8","9"].map(d=>k(d,()=>add(d))),
    k("⌫",()=>{inp.value=inp.value.slice(0,-1);},"del"), k("0",()=>add("0")), k("OK",()=>go(),"ok"));
  const onKey=e=>{ if(!document.body.contains(pad)){ document.removeEventListener("keydown",onKey); return; }
    if(document.activeElement===inp) return;
    if(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if(/^\d$/.test(e.key)){ add(e.key); e.preventDefault(); } else if(e.key==="Backspace"){ inp.value=inp.value.slice(0,-1); e.preventDefault(); } else if(e.key==="Enter"){ go(); e.preventDefault(); } };
  document.addEventListener("keydown",onKey);
  return pad;
}

function fitName(el){ if(!el||!el.isConnected||!el.clientWidth) return; const rg=document.createRange(); rg.selectNodeContents(el); let fs=50; el.style.fontSize=fs+"px";
  while(fs>16 && (rg.getBoundingClientRect().width>el.clientWidth-4 || el.scrollWidth>el.clientWidth)){ fs-=1; el.style.fontSize=fs+"px"; } }

function tick(){
  const now=Date.now(), r=currentResto(); if(!r) return;
  const L=k=>tr(r.lang,k);
  document.querySelectorAll(".tile").forEach(el=>{
    const p=prodById(el.dataset.id); if(!p) return;
    const tm=K.timers[p.id], cd=el.querySelector(".t-cd"), sub=el.querySelector(".t-sub"), bar=el.querySelector(".t-bar i");
    el.classList.remove("run","warn","exp");
    if (!tm){ cd.textContent=mmss(p.minutes*60000); sub.textContent=L("tap"); bar.style.width="0"; }
    else if (now<tm.end){
      el.classList.add("run"); if (tm.end-now<60000) el.classList.add("warn");
      cd.textContent=mmss(tm.end-now);
      sub.textContent=(tm.label!==String(tm.pieces)?tm.label+" · ":"")+tm.pieces+" "+L("pieces")+" · "+L("tap_relaunch");
      bar.style.width=(100*(now-tm.start)/(tm.end-tm.start)).toFixed(1)+"%";
    } else {
      el.classList.add("exp"); cd.textContent="+"+mmss(now-tm.end); sub.textContent=L("expired")+" · "+L("expired_sub");
    }
  });
  const c=$("#clock"); if(c) c.textContent=new Date().toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"});
  const sn=$("#snd"); if(sn) sn.hidden = !(Object.keys(K.timers).length && (!audio || audio.state!=="running"));
  const op=$("#opens"); if(op){ const before=now<openToday(r).getTime() && !Object.keys(K.timers).length; op.hidden=!before; if(before) op.textContent="🍗 "+L("opens")+" "+openTime(r); }
}

function startBatch(p,q){
  const now=Date.now();
  K.timers[p.id]={label:String(q.label),pieces:q.pieces,start:now,end:now+p.minutes*60000};
  saveTimers(); logEvent(ev("cook",K.restoId,p,q.label,q.pieces)); tick();
  if (K.sift.ready){ K.sift.count+=q.pieces; drawSift(); }
}
function endBatch(p,discarded,reason){
  const tm=K.timers[p.id]; if(!tm) return;
  const now=Date.now(), late = now>=tm.end ? Math.round((now-tm.end)/1000) : null;
  if (discarded>0) logEvent(ev("discard",K.restoId,p,tm.label,discarded,null,{reason:reason||"other",late}));
  else logEvent(ev("close",K.restoId,p,tm.label,0,null,{late}));
  delete K.timers[p.id]; saveTimers(); tick();
}
function cancelBatch(p){
  const tm=K.timers[p.id]; if(!tm) return;
  logEvent(ev("cancel",K.restoId,p,tm.label,tm.pieces));
  if (K.sift.ready){ K.sift.count-=tm.pieces; drawSift(); }
  delete K.timers[p.id]; saveTimers(); tick();
}

const PERIODS = { today:"Aujourd'hui", yesterday:"Hier", d7:"7 jours", d30:"30 jours", month:"Ce mois", year:"Cette année", lastyear:"Année dernière", custom:"Dates…" };
const todayStr = () => dayKey(new Date());
if (!A.from){ const d=new Date(); d.setDate(d.getDate()-89); A.from=dayKey(d); A.to=todayStr(); }
function periodBounds(k){
  const sod=new Date(); sod.setHours(0,0,0,0);
  const add=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const y=sod.getFullYear();
  switch(k){
    case "yesterday": return [add(sod,-1),sod];
    case "d7": return [add(sod,-6),add(sod,1)];
    case "d30": return [add(sod,-29),add(sod,1)];
    case "month": return [new Date(y,sod.getMonth(),1),add(sod,1)];
    case "year": return [new Date(y,0,1),add(sod,1)];
    case "lastyear": return [new Date(y-1,0,1),new Date(y,0,1)];
    case "custom": { const [a,b]=[A.from,A.to].sort(); return [new Date(a+"T00:00:00"), add(new Date(b+"T00:00:00"),1)]; }
    default: return [sod,add(sod,1)];
  }
}
function periodRange(k){ return periodBounds(k).map(d=>d.toISOString()); }
const MONTHS_FR=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function bucketsFor(from,to){
  const days=Math.round((to-from)/86400000), out=[];
  if (days<=62){
    for (let d=new Date(from); d<to; d.setDate(d.getDate()+1)) out.push({key:dayKey(d),label:d.toLocaleDateString("fr-CH",days<=8?{weekday:"short",day:"numeric"}:{day:"2-digit",month:"2-digit"})});
    return {grain:"day",buckets:out};
  }
  for (let d=new Date(from.getFullYear(),from.getMonth(),1); d<to; d.setMonth(d.getMonth()+1)) out.push({key:dayKey(d).slice(0,7),label:MONTHS_FR[d.getMonth()]+" "+String(d.getFullYear()).slice(2)});
  return {grain:"month",buckets:out};
}

function compute(rows, hourRows, buckets){
  const T={batches:0,cooked:0,disc:0,chf:0,closeChf:0}, prod=new Map(), resto=new Map(), rp=new Map(), reasons={}, closing=new Map();
  const proc={n:0,sum:0,ontime:0,late5:0};
  const series=new Map(buckets.map(b=>[b.key,{label:b.label,a:0,b:0}]));
  const hours=Array.from({length:24},()=>({a:0,b:0}));
  const get=(m,k,init)=>{ if(!m.has(k)) m.set(k,{batches:0,cooked:0,disc:0,chf:0,...init}); return m.get(k); };
  for (const e of rows){
    const n=Number(e.n), pc=Number(e.pieces);
    if (e.type==="sift"){ T.siftN=(T.siftN||0)+n; T.siftPieces=(T.siftPieces||0)+pc; if (e.label==="late") T.siftLate=(T.siftLate||0)+n; continue; }
    if (e.type==="closing"){
      const sd=(CFG.sides||[]).find(x=>x.id===e.product_id), k=e.product_id+"|"+e.label;
      if (!closing.has(k)) closing.set(k,{id:e.product_id,name:sd?sd.name:e.product_name,unit:e.label,qty:0,chf:0,n:0});
      const c=closing.get(k), cc=pc*(Number(sd&&sd.cost)||0)/(e.label==="g"?100:1);
      c.qty+=pc; c.chf+=cc; c.n+=n; T.closeChf+=cc;
      { const rr=CFG.restaurants.find(x=>x.id===e.restaurant_id), R2=get(resto,e.restaurant_id,{name:rr?rr.name:e.restaurant_id}); R2.closeChf=(R2.closeChf||0)+cc; }
      continue;
    }
    const p=prodById(e.product_id), r=CFG.restaurants.find(x=>x.id===e.restaurant_id);
    const P=get(prod,e.product_id,{name:p?p.name:e.product_name,color:p?p.color:"#777"});
    const Rr=get(resto,e.restaurant_id,{name:r?r.name:e.restaurant_id});
    const RP=get(rp,e.restaurant_id+'|'+e.product_id,{resto:r?r.name:e.restaurant_id,name:p?p.name:e.product_name,color:p?p.color:'#777',ord:CFG.products.findIndex(x=>x.id===e.product_id)});
    P.r=P.r||{}; RP.r=RP.r||{};
    const S=series.get(e.bucket);
    if (e.type==="cook"||e.type==="cancel"){
      const sg=e.type==="cancel"?-1:1;
      [T,P,Rr,RP].forEach(o=>{ o.batches+=sg*n; o.cooked+=sg*pc; }); if (S) S.a+=sg*pc;
    } else if (e.type==="discard"){
      const c=pc*(Number(p&&p.cost)||0);
      [T,P,Rr,RP].forEach(o=>{ o.disc+=pc; o.chf+=c; }); if (S) S.b+=pc;
      const rk=e.reason||"other"; reasons[rk]=(reasons[rk]||0)+pc; P.r[rk]=(P.r[rk]||0)+pc; RP.r[rk]=(RP.r[rk]||0)+pc;
    }
    if (e.type==="discard"||e.type==="close"){ proc.n+=Number(e.late_n); proc.sum+=Number(e.late_sum); proc.ontime+=Number(e.late_ontime); proc.late5+=Number(e.late5); }
  }
  for (const e of hourRows){
    const H=hours[Number(e.bucket)]; if(!H) continue;
    if (e.type==="cook") H.a+=Number(e.pieces); else if (e.type==="cancel") H.a-=Number(e.pieces); else if (e.type==="discard") H.b+=Number(e.pieces);
  }
  const order=new Map(CFG.products.map((p,i)=>[p.id,i]));
  return { T, reasons, proc, closing:[...closing.values()],
    prod:[...prod.entries()].sort((a,b)=>(order.get(a[0])??99)-(order.get(b[0])??99)).map(x=>x[1]),
    resto:[...resto.values()].sort((a,b)=>a.name.localeCompare(b.name)),
    rp:[...rp.values()].filter(o=>o.batches||o.disc).sort((a,b)=>a.resto.localeCompare(b.resto)||a.ord-b.ord),
    series:[...series.values()],
    hours:hours.map((v,i)=>({label:i+"h",a:v.a,b:v.b})) };
}

let trPinTimer=null;
function kitchenTransfer(){
  const inp=h("input",{id:"ktr-pin",type:"password",inputmode:"numeric",autocomplete:"off",placeholder:"••••"});
  openSheet(close=>{
    const go=async()=>{ let ok=false; try{ ok=await store.checkPin(inp.value); }catch(e){ toast("Connexion impossible"); return; }
      if(!ok){ toast("Code incorrect"); inp.value=""; return; }
      const pin=inp.value; close();
      A.pin=pin; clearTimeout(trPinTimer); trPinTimer=setTimeout(()=>{ if(!A.unlocked) A.pin=null; },120000);
      transferSheet(()=>{ if(!A.unlocked) A.pin=null; }, K.restoId, true); };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    return [h("h2",{},"🔄 Transfert"),h("p",{class:"sub"},"Réservé au gérant : entre ton code."),
      h("label",{class:"f",for:"ktr-pin"},"Code",inp), pinPad(inp,go),
      h("button",{class:"act ghost",onclick:close},"Retour")];
  });
}

  const oUpd=()=>{ other={name:oName.value.trim(),unit:oUnit.value.trim()||"unités",cost:parseFloat(oCost.value)||0,q:parseFloat(oQty.value)||0}; refresh(); };

    okBtn.onclick=async()=>{
      if (!from){ trErr("Choisis le restaurant qui donne", fromBox); return; }

const qToText = qs => qs.map(q=>q.label===String(q.pieces)?String(q.pieces):`${q.label}=${q.pieces}`).join(", ");
function parseQ(s){
  return s.split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
    const parts=x.split("=").map(y=>y.trim());
    if (parts.length>1){ const n=parseInt(parts[1],10); return n>0&&parts[0]?{label:parts[0],pieces:n}:null; }
    const n=parseInt(parts[0],10); return n>0?{label:String(n),pieces:n}:null;
  });
}

        store.mode==="supabase" ? h("button",{class:"btn",style:{"align-self":"flex-start"},onclick:e=>sendReportNow(e,"week")},"Envoyer le rapport de la semaine maintenant") : null)),
    h("div",{class:"row-act"},
      h("button",{class:"btn prim",onclick:async()=>{
        if (!/^\d{4,8}$/.test(sd.pin)){ toast("Le PIN doit faire 4 à 8 chiffres"); return; }
        const bad=(sd.report_emails||[]).find(m=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)); if (bad){ toast("Adresse e-mail invalide : "+bad); return; }
        try{ await store.saveRestaurants(rd); await store.saveSettings({pin:sd.pin,volume:sd.volume,report_emails:sd.report_emails||[],sift_every:Number(sd.sift_every)||0}); A.pin=sd.pin; const {pin:_p,...pub}=sd; CFG.restaurants=rd; CFG.settings=pub; LS.set("dc_cfg",CFG); toast("Réglages enregistrés"); }
        catch(e){ toast("Échec de l'enregistrement : "+(e.message||e)); }
      }},"Enregistrer"),
      store.mode==="demo" ? h("button",{class:"btn dang",onclick:async()=>{ await store.clearEvents(); toast("Données d'exemple effacées"); }},"Effacer les données d'exemple") : null));
}

async function reportsView(box){
  box.append(h("p",{class:"muted",style:{"margin-top":"0"}},"📁 Archive pour la compta : tous les PDF sont gardés ici pour toujours. Chaque matin à 7h30 : le journal de la veille. Chaque lundi : le rapport de la semaine (envoyé par e-mail). Chaque 1er du mois : le rapport du mois + les transferts du mois (envoyés par e-mail pour les paiements). Chaque 1er janvier : le rapport de l'année (envoyé par e-mail). Un PDF par restaurant, plus un PDF « Tous les restaurants » pour le mois et l'année."));
  if (store.mode!=="supabase"){ box.append(h("div",{class:"empty"},"Les rapports PDF sont disponibles une fois l'app reliée à la base de données.")); return; }
  const dIn=h("input",{id:"j-date",type:"date",value:(()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKey(d);})(),max:todayStr(),style:{width:"auto"}});
  box.append(h("div",{class:"row-act",style:{"margin-bottom":"16px"}},
    h("button",{class:"btn prim",onclick:e=>sendReportNow(e,"week")},"Générer la semaine dernière"),
    h("button",{class:"btn",onclick:e=>sendReportNow(e,"monthrep")},"Générer le mois dernier"),
    h("button",{class:"btn",onclick:e=>sendReportNow(e,"month")},"Envoyer les transferts du mois dernier"),
    h("button",{class:"btn",onclick:e=>sendReportNow(e,"year")},`Générer l'année ${new Date().getFullYear()-1}`),
    h("span",{style:{flex:"1"}}),
    h("label",{class:"f",for:"j-date",style:{"flex-direction":"row","align-items":"center",gap:"8px"}},"Journal du",dIn),
    h("button",{class:"btn",onclick:e=>sendReportNow(e,"day",dIn.value)},"Créer le journal")));
  const tabsR=h("div",{class:"filters"});
  const kinds=[["all","Tout"],["week","Par semaine"],["month","Par mois"],["year","Par année"],["day","Journaux du jour"]];
  const list=h("div",{class:"empty"},"Chargement…"); box.append(list);
  let groups;
  try{ groups=await store.listReports(); }catch(e){ list.textContent="Impossible de charger les rapports : "+(e.message||e); return; }
  if (!groups.length){ list.textContent="Aucun rapport pour l'instant. Le premier journal arrive demain à 7h30, le premier rapport hebdo lundi."; return; }
  list.className="cards"; list.innerHTML="";
  box.insertBefore(tabsR,list);
  kinds.forEach(([k,l])=>tabsR.append(h("button",{class:"chip"+((A.rkind||"all")===k?" on":""),onclick:()=>{A.rkind=k;renderAdmin();}},l)));
  const MOIS_FR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const fmtFolder=g=> g.kind==="month" ? `Mois de ${MOIS_FR[Number(g.folder.slice(5,7))-1]} ${g.folder.slice(0,4)}` : g.kind==="year" ? `Année ${g.folder}` : g.kind==="day" ? `Journal du ${new Date(g.folder+"T12:00:00").toLocaleDateString("fr-CH",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})}` : `Semaine du ${g.folder.split("-").reverse().join(".")}`;
  groups.filter(g=>(A.rkind||"all")==="all"||g.kind===A.rkind).forEach(g=>list.append(h("div",{class:"card"},
    h("div",{class:"row-act",style:{"justify-content":"space-between"}},
      h("strong",{style:{"font-family":"var(--f-display)","font-size":"22px","text-transform":"uppercase"}},fmtFolder(g)),
      h("span",{class:"pill "+(g.kind==="year"?"p-cook":g.kind==="day"?"p-sift":g.kind==="month"?"p-discard":"p-closing")},g.kind==="year"?"Annuel":g.kind==="day"?"Journal":g.kind==="month"?"Mensuel":"Hebdo")),
    h("div",{style:{display:"flex","flex-direction":"column",gap:"6px"}}, g.files.map(f=>{
      const label=/_Transferts-/.test(f.name) ? "🔄 Transferts · "+f.name.replace(/^.*_Transferts-[\d-]+_?/,"").replace(/\.pdf$/,"").replace(/-/g," ") : f.name.replace(/^Kitchen-Chic-Chicken_(Semaine|Annuel|Mensuel|Journal)-[\d-]+_/,"").replace(/\.pdf$/,"").replace(/-/g," ");
      return h("button",{class:"btn",style:{"text-align":"left"},onclick:async e=>{
        const b=e.currentTarget, old=b.textContent; b.textContent="Ouverture…";
        try{ const url=await store.reportUrl(f.path); const a=h("a",{href:url,target:"_blank",rel:"noopener"}); document.body.append(a); a.click(); a.remove(); }
        catch(err){ toast("Impossible d'ouvrir le PDF"); }
        b.textContent=old;
      }},"📄 "+label);
    })))));
}

async function sendReportNow(e,kind,date){
  const b=e.currentTarget, old=b.textContent; b.disabled=true; b.textContent="Génération en cours…";
  try{
    const r=await fetch(CONFIG.SUPABASE_URL+"/functions/v1/weekly-report",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+CONFIG.SUPABASE_ANON_KEY,apikey:CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({mode:"manual",kind:["year","day","month","monthrep"].includes(kind)?kind:"week",date,pin:A.pin})});
    const j=await r.json().catch(()=>({}));
    toast(!r.ok ? (j.error||"Échec de l'envoi") : j.emailed ? `PDF archivés et envoyés à ${(j.to||[]).join(", ")}` : (j.warning||"PDF archivés"));
    if (r.ok && A.tab==="reports") renderAdmin();
  }catch(err){ toast("Échec de l'envoi : vérifie la connexion"); }
  b.disabled=false; b.textContent=old;
}

/* ---------- Démarrage ---------- */
function route(){
  stopKitchen(); document.querySelectorAll(".ov").forEach(o=>o.remove());
  if (location.hash==="#admin") renderAdmin(); else { A.unlocked=false; A.pin=null; renderKitchen(); }
}
window.addEventListener("hashchange", route);
(async function init(){
  store = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase) ? SupaStore() : LocalStore();
  try{ CFG=await store.loadConfig(); LS.set("dc_cfg",CFG); }
  catch(e){ CFG=LS.get("dc_cfg",null)||{products:DEFAULT_PRODUCTS,restaurants:DEFAULT_RESTAURANTS,settings:{...DEFAULT_SETTINGS},sides:DEFAULT_SIDES}; toast("Hors connexion : dernière configuration utilisée"); }
  CFG.sides = CFG.sides || [];
  route(); flush(); heartbeat();
})();
</script>
